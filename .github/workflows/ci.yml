name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements-build.txt -r requirements-macos.txt

      - name: Unit tests
        env:
          SAYO_DATA: ${{ runner.temp }}/sayo-test
        # 模型权重不进仓库；真实 ASR 用例需本地模型。实时窗口用例在 CI 慢机器上会超时，均留本地验证。
        run: >-
          python -m pytest -q tests
          --deselect=tests/test_audio_gate.py::test_asr_still_transcribes_real_speech
          --deselect=tests/test_live.py::test_following_speech_revises_earlier_text
          --basetemp=${{ runner.temp }}/pytest

      - name: Offline source audit
        run: |
          python -c "import sys; from app.core.offline import audit_source; hits = audit_source('app'); print('联网关键字命中:', len(hits)); [print(h) for h in hits]; sys.exit(1 if hits else 0)"

  # 同一份源码在 Windows 上跑一遍，保证 Mac 侧的合并不会悄悄弄坏 Windows
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements-build.txt -r requirements-windows.txt

      - name: Unit tests
        shell: pwsh
        env:
          SAYO_DATA: ${{ runner.temp }}/sayo-test
        run: |
          python -m pytest -q tests `
            --deselect=tests/test_audio_gate.py::test_asr_still_transcribes_real_speech `
            --deselect=tests/test_live.py::test_following_speech_revises_earlier_text `
            --basetemp=${{ runner.temp }}/pytest
