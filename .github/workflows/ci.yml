name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements-build.txt -r requirements-macos.txt

      - name: Unit tests
        env:
          SAYO_DATA: ${{ runner.temp }}/sayo-test
        run: python -m pytest -q tests --basetemp=${{ runner.temp }}/pytest

      - name: Offline source audit
        run: |
          python -c "import sys; from app.core.offline import audit_source; hits = audit_source('app'); print('联网关键字命中:', len(hits)); [print(h) for h in hits]; sys.exit(1 if hits else 0)"
